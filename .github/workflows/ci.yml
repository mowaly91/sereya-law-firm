name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-tests:
    name: Smoke Tests (no DB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Run smoke tests
        env:
          # DATABASE_URL must be non-empty so db.js does not call process.exit(1).
          # The DB layer is fully mocked in tests; no real Postgres is contacted.
          DATABASE_URL: postgres://ci:ci@localhost/ci_mock
          JWT_SECRET: ci-test-secret-not-for-production
          NODE_ENV: test
          FEATURE_DRIVE_OCR: "false"
          RBAC_STRICT_ADMIN: "true"
        run: cd server && npm test
